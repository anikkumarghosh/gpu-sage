# Heterogeneous PPO training config — use with training/train_ppo.py
# Example: python training/train_ppo.py --steps 250000 --seed 0 --cluster-config configs/heterogeneous_8gpu.yaml --scenario heterogeneous --heterogeneous-obs --reward-config configs/rewards/reward_A_baseline.yaml
cluster:
  config: configs/heterogeneous_8gpu.yaml
environment:
  scenario: heterogeneous
  heterogeneous_obs: true
  num_gpus: 8
  episode_jobs: 100
reward:
  config: configs/rewards/reward_A_baseline.yaml
ppo:
  learning_rate: 0.0003
  n_steps: 2048
  batch_size: 256
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.01
  vf_coef: 0.5
  max_grad_norm: 0.5
  policy: MultiInputPolicy
  seed: 0
  timesteps: 250000
notes: >
  Root cause of Windows hang was MaskableEvalCallback deadlock on heterogeneous env.
  Fix disables eval for hetero (keeps checkpoints/metrics). See training/train_ppo.py.
  Smoke 5k completes in ~9s; 250k in ~5m on this hardware.
