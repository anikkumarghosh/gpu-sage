[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gpu-sage"
version = "0.2.0"
description = "Reinforcement-learning GPU cluster scheduling simulator"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "gymnasium>=1.0",
    "pyyaml>=6.0",
    "pandas>=2.0",
    "matplotlib>=3.8",
    "tensorboard>=2.15",
    "tqdm>=4.66",
    "rich>=13.7",
]

[project.optional-dependencies]
rl = [
    "stable-baselines3[extra]>=2.4",
    "sb3-contrib>=2.4",
    "torch>=2.2",
]
dashboard = [
    "streamlit>=1.40",
    "plotly>=5.24",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.9",
]

[tool.setuptools.packages.find]
where = ["src"]
